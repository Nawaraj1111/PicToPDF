<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JPEG to PDF Pro</title>

    <link rel="stylesheet" href="./index.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>📄 JPEG to PDF Pro</h1>

            <p>
                Convert JPG & JPEG images into a professional PDF.
            </p>

        </header>

        <section class="upload-box" id="uploadBox">

            <h2>Drag & Drop Images Here</h2>

            <p>or</p>

            <button id="selectBtn">
                Select Images
            </button>

            <input type="file" id="fileInput" accept=".jpg,.jpeg,image/jpeg" multiple hidden>

        </section>

        
            <section>

            <h2>Preview</h2>

            <div id="preview" class="preview-grid">

                <div class="empty-message">
                    No images selected.
                </div>

            </div>

        </section>

        <section class="settings">

            <h2>Settings</h2>

            <div class="row">

                <label>Page Size</label>

                <select id="pageSize">

                    <option>A4</option>

                    <option>Letter</option>

                    <option>Legal</option>

                </select>

            </div>

            <div class="row">

                <label>Orientation</label>

                <select id="orientation">

                    <option>Portrait</option>

                    <option>Landscape</option>

                </select>

            </div>

            <div class="row">

                <label>Quality</label>

                <select id="quality">

                    <option>High</option>

                    <option>Medium</option>

                    <option>Low</option>

                </select>

            </div>

        </section>

        <section>

            <h2>Preview</h2>

            <div id="preview"></div>

        </section>

        <div class="center">

            <button id="convertBtn">

                Convert to PDF

            </button>

        </div>

    </div>

    <script src="./script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JPEG to PDF Pro</title>

    <link rel="stylesheet"
          href="index.css">

</head>

<body>

<div class="container">

    <header>

        <h1>JPEG to PDF</h1>

        <p>
            Convert JPG and JPEG images into one PDF.
        </p>

    </header>

    <main>

        <section id="upload-area">

            <p>Drag & Drop Images Here</p>

            <button id="selectBtn">

                Select Images

            </button>

            <input
                type="file"
                id="fileInput"
                accept=".jpg,.jpeg,image/jpeg"
                multiple
                hidden>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>

</html>

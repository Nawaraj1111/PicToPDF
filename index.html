<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPEG to PDF Pro</title>

    <link rel="stylesheet" href="./index.css">
</head>
<body>

<div class="container">

    <!-- Header -->
    <header class="header">

        <h1>📄 JPEG to PDF Pro</h1>

        <p>
            Convert JPG and JPEG images into a professional PDF.
        </p>

    </header>

    <!-- Upload Area -->
    <section id="uploadBox" class="upload-box">

        <div class="upload-icon">
            📂
        </div>

        <h2>Drag & Drop Images Here</h2>

        <p>or</p>

        <button id="selectBtn" type="button">
            Select Images
        </button>

        <input
            type="file"
            id="fileInput"
            accept=".jpg,.jpeg,image/jpeg"
            multiple
            hidden>

    </section>

    <!-- Settings -->
    <section class="settings">

        <h2>PDF Settings</h2>

        <div class="setting-row">

            <label for="pageSize">Page Size</label>

            <select id="pageSize">

                <option value="a4">A4</option>

                <option value="letter">Letter</option>

                <option value="legal">Legal</option>

            </select>

        </div>

        <div class="setting-row">

            <label for="orientation">Orientation</label>

            <select id="orientation">

                <option value="portrait">Portrait</option>

                <option value="landscape">Landscape</option>

            </select>

        </div>

        <div class="setting-row">

            <label for="quality">Image Quality</label>

            <select id="quality">

                <option value="1">High</option>

                <option value="0.7">Medium</option>

                <option value="0.5">Low</option>

            </select>

        </div>

    </section>

    <!-- Preview -->
    <section class="preview-section">

        <div class="preview-header">

            <h2>Selected Images</h2>

            <span id="imageCount">0 Images</span>

        </div>

        <div id="preview" class="preview-grid">

            <div class="empty-message">

                No images selected.

            </div>

        </div>

    </section>

    <!-- Convert Button -->

    <div class="convert-section">

        <button id="convertBtn" type="button">

            📄 Convert to PDF

        </button>

    </div>

</div>

<!-- jsPDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="./script.js"></script>
</body>
</html>

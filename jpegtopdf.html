<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPEG to PDF Converter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.upload{
    border:3px dashed #2196F3;
    padding:40px;
    text-align:center;
    cursor:pointer;
    border-radius:10px;
    transition:.3s;
}

.upload:hover{
    background:#eef7ff;
}

input{
    display:none;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    background:#2196F3;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1565c0;
}

#preview{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:15px;
}

.card{
    border:1px solid #ddd;
    border-radius:8px;
    overflow:hidden;
    text-align:center;
    background:white;
}

.card img{
    width:100%;
    height:130px;
    object-fit:cover;
}

.card p{
    font-size:12px;
    padding:8px;
    word-break:break-word;
}

#status{
    margin-top:20px;
    font-weight:bold;
    color:green;
}
</style>

</head>
<body>

<div class="container">

<h1>JPEG to PDF Converter</h1>

<label class="upload">

Click Here To Select JPEG Images

<input
type="file"
id="images"
accept=".jpg,.jpeg,image/jpeg"
multiple>

</label>

<div style="text-align:center">
<button id="convert">
Convert to PDF
</button>
</div>

<div id="status"></div>

<div id="preview"></div>

</div>

<script>

const input = document.getElementById("images");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

let files=[];

input.addEventListener("change",(e)=>{

files=[...e.target.files];

preview.innerHTML="";

files.forEach(file=>{

const reader=new FileReader();

reader.onload=function(event){

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${event.target.result}">
<p>${file.name}</p>
`;

preview.appendChild(div);

}

reader.readAsDataURL(file);

});

});

document.getElementById("convert").addEventListener("click",async()=>{

if(files.length===0){
alert("Please select images.");
return;
}

status.innerHTML="Creating PDF...";

const {jsPDF}=window.jspdf;

const pdf=new jsPDF({
orientation:"portrait",
unit:"mm",
format:"a4"
});

for(let i=0;i<files.length;i++){

status.innerHTML=`Processing ${i+1} / ${files.length}`;

const imgData=await readImage(files[i]);

const img=new Image();

await new Promise(resolve=>{

img.onload=resolve;
img.src=imgData;

});

const pageWidth=210;
const pageHeight=297;

const ratio=Math.min(
pageWidth/img.width,
pageHeight/img.height
);

const w=img.width*ratio;
const h=img.height*ratio;

const x=(pageWidth-w)/2;
const y=(pageHeight-h)/2;

if(i>0)
pdf.addPage();

pdf.addImage(
imgData,
"JPEG",
x,
y,
w,
h
);

}

pdf.save("Images.pdf");

status.innerHTML="PDF Created Successfully!";

});

function readImage(file){

return new Promise(resolve=>{

const reader=new FileReader();

reader.onload=e=>resolve(e.target.result);

reader.readAsDataURL(file);

});

}

</script>

</body>
</html>
